services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  server:
    build: ./server
    container_name: warroom-server
    restart: unless-stopped
    # Create server/.env with at least WAR_ROOM_APP_USER, WAR_ROOM_APP_PASSWORD,
    # WAR_ROOM_SESSION_SECRET (16+ chars) or the UI will stay open with no login.
    env_file: ./server/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - sqlite-data:/app/data
    expose:
      - "5050"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  client:
    build: ./client
    container_name: warroom-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

volumes:
  sqlite-data:
  redis_data:
